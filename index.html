<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#132b27" />
    <meta name="description" content="《我们先说清楚》是一款关于HIV科学预防、检测、隐私与支持的校园互动叙事游戏。" />
    <title>我们先说清楚｜互动叙事游戏</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" class="app" aria-live="polite"></main>

    <dialog id="factDialog" class="dialog fact-dialog">
      <button class="dialog-close" data-close="factDialog" type="button" aria-label="关闭">×</button>
      <p class="eyebrow">随身事实卡</p>
      <h2>需要时，先看这里</h2>
      <div class="fact-grid">
        <article><strong>72小时</strong><p>PEP应尽早评估，最迟不超过潜在暴露后72小时。</p></article>
        <article><strong>28天</strong><p>如经评估启动PEP，通常需要连续服用28天，具体遵医嘱。</p></article>
        <article><strong>不能靠症状</strong><p>感染状态需要通过检测了解，没有症状不能排除感染。</p></article>
        <article><strong>日常接触不传播</strong><p>一起吃饭、拥抱、握手和蚊虫叮咬不会传播HIV。</p></article>
        <article><strong>检测是隐私</strong><p>陪伴不等于有权知道结果，更不能替别人公开。</p></article>
        <article><strong>U=U</strong><p>规范治疗并持续达到病毒载量检测不到时，不会通过性行为传播HIV。</p></article>
      </div>
      <p class="dialog-note">具体检测、用药与随访安排，请咨询当地正规医疗卫生机构。</p>
    </dialog>

    <dialog id="restartDialog" class="dialog confirm-dialog">
      <p class="eyebrow">重新开始</p>
      <h2>清除当前故事进度？</h2>
      <p>角色设置和本局选择会被清除。</p>
      <div class="dialog-actions">
        <button class="button ghost" data-close="restartDialog" type="button">继续故事</button>
        <button class="button danger" id="confirmRestart" type="button">清除并重来</button>
      </div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
